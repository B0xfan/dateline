# Manual trigger only, on purpose: start a run with scripts/cloud-build.sh. No push or schedule triggers.
name: build
on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Only the iPhone jobs (for fast fixing)"
        type: boolean
        default: false
jobs:
  # The iPhone app on the sample calendars: built for the simulator (Debug, so the checks and pictures are in), its checks, and a light and dark picture of each screen.
  ios-app:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Xcode 26 (John's Mac has 27, which also works): the default Xcode 16 here cannot read the Icon Composer app icon.
      - name: Use Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Build the iPhone app
        run: |
          xcodebuild build -project iPhone/Dateline.xcodeproj -scheme DatelinePhone -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          # An Xcode too old for Icon Composer files copies the icon folder as-is and builds an app with no icon, so check it was compiled.
          app="$(find dd/Build/Products -maxdepth 3 -name DatelinePhone.app | head -1)"
          [ -f "$app/Assets.car" ] && ls "$app"/AppIcon*.png >/dev/null || { echo "the iPhone app has no compiled icon"; exit 1; }
      - name: Checks and screen pictures
        run: scripts/ios-check.sh "$(find dd/Build/Products -maxdepth 3 -name DatelinePhone.app | head -1)" ios-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-shots
          path: ios-shots
          retention-days: 3
          if-no-files-found: ignore
  # The Apple Watch app on the sample calendars: built for the watch simulator and a picture of each screen at 41, 45 and 49 mm.
  watch-app:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Build the watch app
        run: |
          xcodebuild build -project iPhone/Dateline.xcodeproj -scheme DatelineWatch -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Screen pictures
        run: scripts/watch-check.sh "$(find dd/Build/Products -maxdepth 3 -name DatelineWatch.app | head -1)" watch-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-shots
          path: watch-shots
          retention-days: 3
          if-no-files-found: ignore
  # The shared DatelineCore package must keep compiling for the iPhone. No signing, nothing uploaded.
  ios-core:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Xcode 26 (John's Mac has 27, which also works): the default Xcode 16 here cannot read the Icon Composer app icon.
      - name: Use Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Build DatelineCore for iOS
        run: |
          xcodebuild build -scheme DatelineCore -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
  build:
    if: ${{ !inputs.quick }}
    # macOS 26: on macOS 15 the icon tool crashes making the Mac icon (the iPhone icon is fine there).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Xcode 26 (John's Mac has 27, which also works): the default Xcode 16 here cannot read the Icon Composer app icon.
      - name: Use Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Release build
        run: swift build -c release -j 2
      - name: Self-test (pure logic only, no calendar access)
        run: .build/release/Dateline --selftest
      - name: Package the app
        run: |
          scripts/make-app.sh
          ditto -c -k --keepParent "build/Dateline.app" Dateline.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Dateline
          path: Dateline.zip
          retention-days: 3
          compression-level: 0
